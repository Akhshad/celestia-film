<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Enquire · Celestia Banquets · Nagpur</title>
<meta name="description" content="Enquire about the halls, rooftop and guest rooms at Celestia Banquets, Nagpur.">
<meta name="theme-color" content="#0b0907">
<link rel="preload" href="/fonts/Cambon-Regular.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body class="enq-body">
<header class="enq-top">
  <a href="./" class="enq-brand"><b>Celestia</b> Banquets</a>
  <a href="./" class="enq-backlink"><span></span>Back to Celestia</a>
</header>

<main class="enq">
  <section class="enq-visual" aria-hidden="true">
    <img src="/halls/front-mobile.webp" alt="">
    <div class="enq-visual-text">
      <p class="enq-kicker"><span></span>Nagpur</p>
      <h1>Plan your<br>celebration</h1>
      <p>Four halls, a rooftop under the sky and 80 guest rooms, all at one address.</p>
    </div>
  </section>

  <section class="enq-form-wrap">
    <h2 class="enq-title">Enquire</h2>
    <p class="enq-lead">Tell us a little about your occasion and the Celestia team will get back to you.</p>
    <form id="enquiry" class="enq-form" novalidate>
      <div class="enq-row">
        <label>Name<input name="name" required autocomplete="name" placeholder="Your full name"></label>
        <label>Phone<input name="phone" required type="tel" inputmode="tel" autocomplete="tel" placeholder="Mobile number"></label>
      </div>
      <label>Email <i>(optional)</i><input name="email" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <div class="enq-row">
        <label>Interested in
          <select name="for" required>
            <option value="g">Orion · Ground floor · 400–500</option>
            <option value="g-1">Orion · Part 1 · 200</option>
            <option value="g-2">Orion · Part 2 · 200</option>
            <option value="f1">Nova · First floor · 2,000 standing</option>
            <option value="f2">Horizon · Second floor · 1,500 standing</option>
            <option value="f5">Rooftop · Fifth floor · 500</option>
            <option value="rooms">Guest rooms</option>
            <option value="unsure" selected>Not sure yet</option>
          </select>
        </label>
        <label>Occasion
          <select name="occasion" required>
            <option value="" disabled selected>Choose an occasion</option>
            <option>Wedding</option><option>Reception</option><option>Engagement</option>
            <option>Haldi / Mehendi / Sangeet</option><option>Birthday</option><option>Anniversary</option>
            <option>Baby shower / Naming ceremony</option><option>Family gathering</option><option>Festive celebration</option><option>Corporate event</option>
            <option>Stay / guest rooms</option><option>Other</option>
          </select>
        </label>
      </div>
      <div class="enq-row">
        <label>Event date<input name="date" type="date"></label>
        <label>Expected guests<input name="guests" type="number" min="1" inputmode="numeric" placeholder="Approx. guest count"></label>
      </div>
      <label class="enq-rooms" hidden>Rooms needed<input name="rooms" type="number" min="1" max="80" inputmode="numeric" placeholder="Number of rooms"></label>
      <label>Message <i>(optional)</i><textarea name="message" rows="3" placeholder="Anything else we should know"></textarea></label>
      <input type="checkbox" name="botcheck" class="enq-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="enq-submit">Send enquiry <span>↗</span></button>
      <p class="enq-status" role="status"></p>
    </form>
  </section>
</main>

<script type="module" src="/src/enquiry.ts"></script>
</body>
</html>
