  [.866, 12.5, -36, 132, 17],
  [.950, 10.5, -30, 128, 19],
  [1.00, 10.0, -26, 124, 19]];
function camAt(p) {
  let k = CAMK.length - 2;
  for (let i = 1; i < CAMK.length; i++) if (p <= CAMK[i][0]) { k = i - 1; break; }
  const a = CAMK[k], b = CAMK[k + 1];
  const t = easeInOut(clamp((p - a[0]) / (b[0] - a[0]), 0, 1));
  const el = lerp(a[1], b[1], t) * D2R, az = lerp(a[2], b[2], t) * D2R;
  let d = lerp(a[3], b[3], t);
  const asp = W / H;
  const need = 46 / (Math.tan(VFOV / 2) * asp);           // keep ~92 m (building + drape) inside narrow screens
  d = Math.max(d, lerp(d, need, sstep(70 * D2R, 40 * D2R, el)));
  const T = [0, lerp(a[4], b[4], t), 2];
  const E = [T[0] + d * Math.cos(el) * Math.sin(az), T[1] + d * Math.sin(el), T[2] + d * Math.cos(el) * Math.cos(az)];
  return { E, T };
}

function drapeAttribs() {
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 56, 0); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 56, 12); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 56, 24);
  gl.vertexAttribPointer(3, 2, gl.FLOAT, false, 56, 36); gl.vertexAttribPointer(4, 3, gl.FLOAT, false, 56, 44);
}
function drawShadowMap(fall) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, S3D.shFbo);
  gl.viewport(0, 0, SHN, SHN);
  gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  const dp = S3D.dp; gl.useProgram(dp.p); gl.uniformMatrix4fv(dp.u.uVP, false, S3D.LVP);
  gl.enableVertexAttribArray(0); for (let i = 1; i < 5; i++) gl.disableVertexAttribArray(i);
  for (const m of S3D.meshes) {
    if (m.mode > .5 && m.mode < 1.5) continue;       // the ground only receives
    gl.bindBuffer(gl.ARRAY_BUFFER, m.vb); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ib);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
    gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_SHORT, 0);
  }
  if (fall > 0 && S3D.drape) {
    const dd = S3D.dpd; gl.useProgram(dd.p);
    gl.uniformMatrix4fv(dd.u.uVP, false, S3D.LVP); gl.uniform1f(dd.u.uFall, fall); gl.uniform1f(dd.u.uTime, time);
    gl.bindBuffer(gl.ARRAY_BUFFER, S3D.drape.vb); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, S3D.drape.ib);
    for (let i = 0; i < 5; i++) gl.enableVertexAttribArray(i);
    drapeAttribs();
    gl.drawElements(gl.TRIANGLES, S3D.drape.n, gl.UNSIGNED_SHORT, 0);
    for (let i = 1; i < 5; i++) gl.disableVertexAttribArray(i);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function draw3D(p) {
  const w = glc.width, h = glc.height;
  const fall = clamp((p - .87) / (.95 - .87), 0, 1);
  if (S3D.shOK && (fall !== S3D.shFall || (fall > 0 && fall < 1) || !S3D.shDone)) { drawShadowMap(fall); S3D.shFall = fall; S3D.shDone = true; }
  gl.viewport(0, 0, w, h);
  gl.clearColor(FOG3[0], FOG3[1], FOG3[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const { E, T } = camAt(p);
  const proj = m4.persp(VFOV, w / h, 1, 2500), view = m4.look(E, T, [0, 1, 0]);
  const VP = m4.mul(proj, view);
  // sky
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  const sk = S3D.sky; gl.useProgram(sk.p);
  gl.uniformMatrix4fv(sk.u.uInv, false, m4.inv(VP)); gl.uniform3fv(sk.u.uCam, E); gl.uniform3fv(sk.u.uSun, SUN3); gl.uniform1f(sk.u.uExp, EXPOSURE);
  gl.bindBuffer(gl.ARRAY_BUFFER, S3D.tri); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  for (let i = 1; i < 5; i++) gl.disableVertexAttribArray(i);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.CULL_FACE);
  // model
  const ms = S3D.mesh; gl.useProgram(ms.p);
  gl.uniformMatrix4fv(ms.u.uVP, false, VP); gl.uniformMatrix4fv(ms.u.uLVP, false, S3D.LVP);
  gl.uniform3fv(ms.u.uSun, SUN3); gl.uniform3fv(ms.u.uCam, E); gl.uniform1f(ms.u.uExp, EXPOSURE);
  gl.uniform2f(ms.u.uShTexel, 1 / SHN, 1 / SHN);
  gl.uniform1i(ms.u.uTex, 0); gl.uniform1i(ms.u.uShadow, 1);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, S3D.shOK ? S3D.shTex : null);
  gl.activeTexture(gl.TEXTURE0);
  for (let i = 0; i < 3; i++) gl.enableVertexAttribArray(i);
  const drawM = m => {
    gl.uniform1f(ms.u.uMode, m.mode); gl.uniform1f(ms.u.uMetal, m.metal || 0);
    gl.bindTexture(gl.TEXTURE_2D, m.tex);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.vb); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ib);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 32, 24);
    gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_SHORT, 0);
  };
  if (S3D.far) { gl.depthMask(false); drawM(S3D.far); gl.depthMask(true); }
  for (const m of S3D.meshes) drawM(m);
  // drape
  if (fall > 0 && S3D.drape) {
    const dr = S3D.dr, D3 = S3D.drape; gl.useProgram(dr.p);
    gl.uniformMatrix4fv(dr.u.uVP, false, VP); gl.uniform1f(dr.u.uFall, fall); gl.uniform1f(dr.u.uTime, time);
    gl.uniform3fv(dr.u.uSun, SUN3); gl.uniform3fv(dr.u.uCam, E); gl.uniform3fv(dr.u.uBase, DRAPE_RGB); gl.uniform1f(dr.u.uExp, EXPOSURE);
    gl.uniform2fv(dr.u.uTexel, S3D.drapeTexel); gl.uniform1i(dr.u.uTex, 0); gl.bindTexture(gl.TEXTURE_2D, D3.tex);
    gl.bindBuffer(gl.ARRAY_BUFFER, D3.vb); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, D3.ib);
    for (let i = 0; i < 5; i++) gl.enableVertexAttribArray(i);
    drapeAttribs();
    gl.drawElements(gl.TRIANGLES, D3.n, gl.UNSIGNED_SHORT, 0);
    for (let i = 3; i < 5; i++) gl.disableVertexAttribArray(i);
  }
  bloom(w, h, .65);
}
let glShown = false;
function show3D(on) { if (on !== glShown) { glShown = on; glc.style.opacity = on ? 1 : 0; } }

/* =====================================================================
   FRAME
   ===================================================================== */
function render(p) {
  const L = Lat(p);
  const use3D = S3D.ready, live3D = use3D && p > .735;
  if (live3D) draw3D(p);
  show3D(live3D);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (live3D && p > .741) ctx.clearRect(0, 0, W, H);
  else {
    ctx.fillStyle = '#04050b'; ctx.fillRect(0, 0, W, H);
    if (L < LK.ind + .5) drawBG(L, 1 - sstep(LK.globe + .4, LK.ind - .2, L));
    if (L < 6.8) drawGalaxy(L);
    const globeA = sstep(LK.earth - .06, LK.earth + .12, L);
    if (L > LK.sun - .9 && L < LK.earth + 2) drawSolar(L, globeA);
    if (L > LK.earth - .07 && p < .76) drawEarth(L, p);
    if (!use3D && p > .73) drawHall(p);
  }
  if (p > .67 && p < .805) drawClouds(p);
  const wo = sstep(.71, .736, p) * (1 - sstep(.74, .772, p)) * .96;
  if (wo > 0) { ctx.globalAlpha = wo; ctx.fillStyle = S3D.ready ? '#f4e2d4' : '#eef2f8'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.globalAlpha = live3D ? .55 : 1; drawVignette(); ctx.globalAlpha = 1;
  if (!use3D) drawDrape2D(p);
  for (const l of lines) {
    const t = (p - l.a) / (l.b - l.a);
    const o = t <= 0 || t >= 1 ? 0 : sstep(0, .2, t) * (1 - sstep(.8, 1, t));
    if (o !== l.o) {
      l.o = o;
      l.el.style.opacity = o.toFixed(3);
      l.el.style.transform = `translateY(${((1 - sstep(0, .25, t)) * 18 - sstep(.8, 1, t) * 14).toFixed(1)}px)`;
      l.el.style.filter = o < .99 ? `blur(${((1 - o) * 6).toFixed(1)}px)` : 'none';
    }
  }
  const ho = 1 - sstep(.004, .03, p);
  if (ho !== hint._o) { hint._o = ho; hint.style.opacity = ho.toFixed(3); }
}

function resize() {
  const r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(2, Math.round(r.width * DPR)); H = Math.max(2, Math.round(r.height * DPR));
  cv.width = W; cv.height = H;
  GLS = Math.min(window.devicePixelRatio || 1, 1.5);
  glc.width = Math.round(r.width * GLS); glc.height = Math.round(r.height * GLS);
  MIN = Math.min(W, H); MAX = Math.max(W, H); CX = W / 2; CY = H / 2; PORTRAIT = H > W * 1.05;
  VIG = null;
  buildKeys(); layoutHall(); buildTextTexture(false);
}

let pT = 0, pS = 0, last = performance.now();
function readScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  pT = max > 0 ? clamp(scrollY / max, 0, 1) : 0;
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  pS += (pT - pS) * (reduced ? 1 : 1 - Math.exp(-dt * 4.2));
  if (Math.abs(pT - pS) < 1e-5) pS = pT;
  render(pS);
  requestAnimationFrame(frame);
}

// ---- boot ----
buildLayers(); buildGalaxy(); buildBG(); buildClouds();
const ph = buildPlaceholderHall();
setHall(ph.img, ph.b);
resize();
buildTextTexture(true);
if (HALL_IMAGE) {
  const im = new Image();
  im.onload = () => { setHall(im, HALL_BUILDING); buildTextTexture(true); };
  im.src = HALL_IMAGE;
}
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('italic 500 80px "Cormorant Garamond"'), document.fonts.load('500 40px Jost')]).then(() => buildTextTexture(true)).catch(() => {});
}
addEventListener('scroll', readScroll, { passive: true });
new ResizeObserver(() => resize()).observe(stage);
readScroll(); pS = pT;
window.__celestia = { setP: v => { pT = pS = v; }, s3d: S3D };
start3D();
requestAnimationFrame(frame);
})();
</script>
